[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-cbir"
version = "0.1.0"
description = "Handcrafted-feature CBIR for mature woody-tree images"
requires-python = ">=3.14,<3.15"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL with pgvector"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["experiments/p03_v2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
